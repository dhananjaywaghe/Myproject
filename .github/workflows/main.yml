name: Hello World Workflow

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test job
        run: echo "Hello from test"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Build job
        run: echo "Hello from build"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy job
        run: uname -r